# ===========================================================================
# V14  FUTURE PLC SIGNALS  (documentation only - no electrical model yet)
# ---------------------------------------------------------------------------
# These are the digital signals the cell will exchange with the PLC
# (Modicon M262, TM262L10MESE8T) in a future iteration.  V14 does NOT
# model wiring, terminals or control logic - this block simply reserves
# and documents the I/O map so the next iteration has a contract.
#   DI = digital input  to the PLC   (sensor / cobot -> PLC)
#   DO = digital output from the PLC (PLC -> actuator driver / valve)
# ===========================================================================
future_plc_signals:
  digital_inputs:
    DI_sensor_conveyor_end:
      direction: DI
      source: sensor_conveyor_end (SICK GRTE18S-P2312)
      meaning: a CAFI has reached the pick end of Conveyor 1 and is ready to be picked
    DI_sensor_rotary_load_piece_present:
      direction: DI
      source: sensor_rotary_load_fixture (SICK GRTE18S-P2312)
      meaning: a CAFI is present on the external load fixture of the rotary disc
    DI_sensor_vision_piece_present:
      direction: DI
      source: sensor_vision_piece_present (SICK GRTE18S-P2312)
      meaning: a CAFI is present on the vision fixture, ready for Cognex inspection
    DI_cobot_cycle_or_ready:
      direction: DI
      source: Lexium Cobot LXMRL03S0000 controller (LXMRL03C1000)
      meaning: |
        The cobot will send a digital input to the PLC for process
        coordination - e.g. "cycle complete / ready for next step".
        V14 documents this signal only; no cobot I/O or wiring is
        modelled yet.
  digital_outputs:
    DO_conveyor_motor_run:
      direction: DO
      target: conveyor_drive_motor (via VFD / contactor)
      meaning: run / stop the Conveyor 1 belt drive
    DO_rotary_table_motor_index:
      direction: DO
      target: rotary_table_drive NEMA 17 (via stepper driver)
      meaning: command the 180-deg index of the riveting rotary disc
    DO_gripper_open_solenoid:
      direction: DO
      target: gripper 5/2 solenoid valve (open side) -> gripper_pneumatic_cylinder_25mm
      meaning: route air to OPEN the gripper jaws
    DO_gripper_close_solenoid:
      direction: DO
      target: gripper 5/2 solenoid valve (close side) -> gripper_pneumatic_cylinder_25mm
      meaning: route air to CLOSE the gripper jaws
