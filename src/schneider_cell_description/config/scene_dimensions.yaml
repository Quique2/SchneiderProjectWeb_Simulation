# ===========================================================================
# V14  PNEUMATICS
# ===========================================================================
gripper_pneumatics:
  source: V15_integrated_on_real_gripper_ports
  parent_frame: gripper_base
  parent_frame_source_v15: |
    V14 parented this off lexium_cobot_tool0 at hand-guessed offsets, so
    the cylinder floated OUTSIDE the gripper and the inlets were not on
    any real port.  V15 re-parents it to `gripper_base` (the gripper
    link itself) so it inherits the gripper's 180-deg mount_yaw and
    stays integrated.  All offsets are now expressed in the gripper_base
    frame using the real mesh->link map
      link_x = -0.172 + 0.001*mesh_x
      link_y = -0.085 + 0.001*mesh_z
      link_z =  0.083 - 0.001*mesh_y
  note: |
    The new_gripper itself (its 5 STLs, its Rx(-pi/2) mount transform,
    its teeth-down orientation, its attachment to the TCP) is NOT
    touched.  This block only ADDS pneumatic hardware so the actuation
    is legible.
  air_inlets:
    inlet_a:
      gripper_mesh_port_mm: {x: 172.2, y: 77.3, z: 56.0}   # real circular port on the fixture +Y face
      gripper_link_xyz_m: {x: 0.0002, y: -0.029, z: 0.0057}
      world_xyz_m: {x: 1.641548, y: 1.275726, z: 1.662493}
      type: push-to-connect fitting (stem + hex collar), on the real gripper port
    inlet_b:
      gripper_mesh_port_mm: {x: 172.2, y: 77.3, z: 86.0}   # real circular port on the fixture +Y face
      gripper_link_xyz_m: {x: 0.0002, y: 0.001, z: 0.0057}
      world_xyz_m: {x: 1.671548, y: 1.275726, z: 1.662493}
      type: push-to-connect fitting (stem + hex collar), on the real gripper port
  inlets_source_v15: |
    The two inlets sit EXACTLY on the two circular air ports found on the
    +Y face of the new_gripper_fixture housing (mesh ports at z=56 and
    z=86, located by geometric analysis of the STL).  No more arbitrary
    placement.
  cylinder_25mm:
    name: gripper_pneumatic_cylinder_25mm
    source: V15_proxy_integrated
    bore_class_mm: 16        # MAL16x25-class compact cylinder
    stroke_mm: 25
    barrel_len_m: 0.050
    gripper_link_barrel_centre_m: {x: 0.000, y: -0.012, z: -0.005}
    axis: gripper_base link Y  (= mesh Z, the housing long axis)
    mount: |
      V15: mounted FLUSH on the +Y face of the new_gripper_fixture
      housing, running along the housing length, held by two saddle
      clamps, rod pointing link -Y toward the jaw mechanism.  It now
      reads as the actuator that drives the jaws - it is NOT floating
      outside the gripper any more (V14 had it at tool0 x=0.030, fully
      detached).
    anatomy: barrel + 2 end caps + extended rod + clevis + 2 port nipples + 2 saddle clamps
    cad_search_note: |
      Credible PROXY with the correct functional dimensions
      (16 mm bore class, 25 mm stroke).
  component_file: urdf/components/gripper_pneumatics.xacro
  future_plc_signals: [DO_gripper_open_solenoid, DO_gripper_close_solenoid]

