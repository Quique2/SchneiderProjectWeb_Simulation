  mesh_scale: [0.001, 0.001, 0.001]
  model: SICK GRTE18S-P2312
  source_step: planta Schneider/Sensor fotoelétrico SICK GRTE18S-P2312.STEP
  conversion: gmsh 4.15.2 (OpenCASCADE), STEP -> binary STL (mm)
  mesh_bbox_mm: {x: [-9.0, 9.0], y: [0.0, 38.1], z: [-9.0, 9.0]}

  sensor_conveyor_end:
    function: detects a CAFI that has reached the pick end of Conveyor 1
    optical_face_world_m: {x: 1.400, y: 0.760, z: 1.300}
    beam_yaw: 1.5707963267948966          # link +X = world +Y (north, across the belt)
    beam_pitch: 0.0
    beam_len_m: 0.200
    mount: bracket SOUTH of the belt, beam transverse NORTH across it
    bracket_foot_world_m: {x: 1.400, y: 0.682, z: 1.200}
    monitored_target: Conveyor 1 pick end (belt top z=1.265, end X=1.419)
    future_plc_signal: DI_sensor_conveyor_end

  sensor_rotary_load_fixture:
    function: detects piece presence on the EXTERNAL load fixture of the rotary disc
    optical_face_world_m: {x: 1.560, y: 1.275, z: 1.238}
    beam_yaw: 0.0                          # link +X = world +X (east, toward the CAFI)
    beam_pitch: 0.0
    beam_len_m: 0.140
    mount: bracket WEST of the load fixture, beam horizontal EAST - detects from the SIDE
    bracket_foot_world_m: {x: 1.482, y: 1.275, z: 1.200}
    monitored_target: rotary load fixture CAFI (base z=1.225, top z=1.250) at world (1.671, 1.275)
    clearance_note: west side keeps it clear of the new_gripper and the cobot's south-side approach
    future_plc_signal: DI_sensor_rotary_load_piece_present

  sensor_vision_piece_present:
    function: confirms a CAFI is present on the vision fixture before the Cognex inspects
    optical_face_world_m: {x: 2.050, y: 1.340, z: 1.228}     # V16: was (2.050, 1.110, 1.228) - moved to NORTH side
    beam_yaw: -1.5707963267948966           # V16: link +X = world -Y (south, toward the CAFI) - was +pi/2
    beam_pitch: 0.0
    beam_len_m: 0.180                                          # V16: was 0.160
    mount: bracket NORTH of the vision plate, beam transverse SOUTH    # V16: was south-side
    bracket_foot_world_m: {x: 2.050, y: 1.418, z: 1.204}     # V16: bracket foot now north of vision_zone
    monitored_target: vision fixture CAFI (base z=1.215, top z=1.240) at world (2.050, 1.200)
    clearance_note: |
      V16: moved to the NORTH side of the vision fixture because the
      old SOUTH-side mount had the fixture directly in front of the beam.
      North side keeps the beam clear of the fixture body; bracket sits
      on the plant table north of the vision_zone table; no clash with
      the Cognex aim ray (in the Y=1.200 vertical plane) or with the
      cobot's approach to the fixture from the west/SW.  The V13 vision
      station (fixture, Cognex body, column) is NOT moved.
    future_plc_signal: DI_sensor_vision_piece_present

