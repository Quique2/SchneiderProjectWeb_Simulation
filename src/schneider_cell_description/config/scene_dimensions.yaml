      The COLUMN is outside the reach (0.716 m, 90 mm beyond).  The
      camera body is technically 0.607 m horizontally from the cobot
      (just inside the reach radius) but is 82 mm ABOVE the cobot's
      static tool0 z = 1.668 m, so the cobot's gripper (which hangs
      below tool0) cannot physically contact it when picking from the
      fixture.  When extending to the fixture XY, the cobot's wrist
      + tool0 stack drops to tool0 z, leaving the camera body above
      it.

# ---------------------------------------------------------------------------
# Gripper (V9: REPLACED with new_gripper, V7/V8 gripper_schneider REMOVED)
# ---------------------------------------------------------------------------
gripper:
  source: V9_new_gripper_user_assembly
  source_files:
    sldasm: C:\Users\santi\Downloads\new_gripper\new_gripper.SLDASM
    parts:
      - new_gripper_stump.SLDPRT     # mounting plate (mesh +Y face = TCP)
      - new_gripper_neck.SLDPRT      # transition block
      - new_gripper_appendage.SLDPRT # extension arm
      - new_gripper_fixture.SLDPRT   # main jaw / housing (170 mm long)
      - new_gripper_fixture1.SLDPRT  # opposing jaw / housing
  export_method: SolidWorks_COM_API_via_pywin32_SaveAs3_binary_STL_mm
  meshes_in_package: package://schneider_cell_description/meshes/gripper_new/
  parent_frame: lexium_cobot_tool0
  mount_rpy: [-1.5707963267948966, 0.0, 0.0]
  mount_rpy_note: |
    Rx(-pi/2):  R*(a,b,c) = (a, c, -b).  Maps mesh +Y (mount face direction)
    to link -Z, and mesh -Y (body extension direction) to link +Z.  Link
    +Z is tool0 +Z = world -Z, so the body extension hangs straight DOWN
    in world.  Jaws point downward.
  mount_yaw: 3.141592653589793
  mount_yaw_source_v15: |
    V15: mount_yaw = pi is applied to the lexium_cobot_tool0 -> gripper_base
    JOINT origin (rpy 0 0 pi), NOT to the mesh visuals.  It rotates the
    whole gripper 180 deg about the TCP vertical axis (a yaw in the XY
    plane).  The rotation axis is tool0 Z, which points world -Z, so the
    jaws still point straight DOWN and the gripper base stays bolted to
    lexium_cobot_tool0.  FK check: gripper_base world rpy goes from
    V14 (pi,0,-pi/2) to V15 (pi,0,+pi/2) - X/Y axes flipped, Z unchanged.
    The 5 mesh visuals and their visual_origin_offset are NOT touched.
  visual_origin_offset_m: {x: -0.172000, y: -0.085000, z: 0.083000}
  visual_origin_offset_source: |
    Mount-face centre in mesh = (mid_x=172, +Y_face=83, mid_z=85) mm.
    For (172,83,85) to land on link (0,0,0) under Rx(-pi/2):
      R*(172,83,85) = (172, 85, -83);  xyz = -R*(.) = (-172, -85, +83) mm.
    Sanity: body-bottom mesh (172, 0, 85) -> R*(.)=(172, 85, 0) + xyz
            = (0, 0, +83) mm  =>  body bottom at link z=+0.083 m
            =>  world z = tool0_z - 0.083 (since tool0 +Z = world -Z).
            =>  body hangs 83 mm BELOW tool0 in world.
  mesh_bboxes_mm:
    stump:     {x: [140.21, 204.21], y: [ 77.27, 83.27], z: [ 39.16, 103.14]}
    neck:      {x: [162.46, 182.21], y: [ 43.77, 73.52], z: [100.65, 121.40]}
    appendage: {x: [162.71, 182.21], y: [  3.52, 68.27], z: [121.40, 141.40]}
    fixture:   {x: [162.21, 187.21], y: [  0.27, 77.27], z: [  0.65, 170.65]}
    fixture1:  {x: [157.21, 162.21], y: [ 40.27, 77.27], z: [  0.65, 170.65]}
  mesh_scale: [0.001, 0.001, 0.001]
  lowest_world_z_m: 1.5855
  removed_in_v9:
    - gripper_schneider.xacro
    - meshes/gripper/*.STL (12 old gripper meshes)

