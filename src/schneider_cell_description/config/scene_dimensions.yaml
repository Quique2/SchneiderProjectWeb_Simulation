    With anchor yaw = pi and arm_length = 0.12, the column joint
    origin (-arm_length, 0, z) in the anchor frame maps to a world X
    offset of +arm_length = +0.120.  Column world XY = (2.330, 1.200).
    Mesa east edge 2.265 -> column is 65 mm EAST of the mesa edge,
    OUTSIDE the mesa footprint, anchored to the floor.  Column lives
    in the "right-side bracket" zone the user requested
    (x ~ 2.28..2.33, y ~ 1.20..1.30).
  body_world_xyz_m: {x: 2.210, y: 1.200, z: 1.750}
  body_world_xyz_note_v13: |
    Camera body is 55 mm WEST of the mesa east edge (inside mesa
    footprint in X), 0.082 m ABOVE the cobot's static tool0 z=1.668;
    so vertical separation prevents collision when the cobot reaches
    into the fixture area.
  cobot_clearance_v13:
    cobot_base_world_m: {x: 1.671, y: 0.920}
    cobot_reach_radius_m: 0.626
