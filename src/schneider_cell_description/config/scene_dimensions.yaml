# ============================================================================
# scene_dimensions.yaml  -  V37 (DXF-driven layout + floor-mounted cobot +
#                                new disco giratorio STL assembly)
# ============================================================================
# V37 supersedes the V19..V36 layout block with a brand-new XY layout
# imported from /dxf/PlantaSchneiderReal.dxf (the user's real planta).
# Conversion: DXF is in mm, 1 mm = 0.001 m.  DXF origin (0,0) sits at the
# south-west corner of the mesa (1620 x 920 mm in DXF).  The mesa was
# re-anchored in world so its centre still lands at (1.252, 1.049),
# preserving the V36 world frame.
#
# DXF-to-world mapping:   world_x = dxf_x_mm/1000 + 0.442
#                         world_y = dxf_y_mm/1000 + 0.589
#
# Mesa real (UNCHANGED vs V36, just re-confirmed against DXF outer
# polyline #40 = 1620 x 920 mm rectangle):
#    length 1.62 m, ancho 0.92 m, top z = 1.00 m, floor at z=0.
#
# DXF MTEXT labels parsed (8 labels):
#    "Conveyor"                            DXF (875.9, 920.0)
#    "Aceptado"                            DXF (861.0, -19.5)
#    "Rechazado"                           DXF (571.0, -18.2)
#    "Estación de control"                 DXF ( -34.6, -191.4)
#    "Zona de remachado y disco giratorio" DXF (1188.5, 83.6)
#    "Fixture remache"                     DXF (184.4, 850.6)
#    "Camara"                              DXF (514.5, 301.5)
#    "Fixture camara"                      DXF (186.1, 90.6)
#
# Key DXF features:
#    - Outer LWPOLYLINE #40 (1620 x 920 mm) = mesa outline.
#    - LWPOLYLINE #47 (375 x 150 mm @ center 927.5, 775.7)  = conveyor.
#    - LWPOLYLINE #41 (500 x 500 mm @ center 250.1, 670.0) +
#      CIRCLE (r=200 mm @ center 250.1, 670.0)               = disco giratorio.
#         500x500 matches gearbase STL (530 x 500 mm).
#         r=200 mm matches disco-1 STL (400 mm diameter).
#    - LWPOLYLINE #46 (150 x 151 mm @ center 381.5, 215.1)  = fixture camara.
#    - CIRCLE (r=660 mm @ center 819.7, 383.1)              = cobot reach
#         envelope (matches L03S reach 626 mm + tool clearance).
#    - LWPOLYLINE #37 (227 x 182 mm @ center 668.3,  94.7)  = rechazado bin.
#    - LWPOLYLINE #38 (227 x 172 mm @ center 968.7,  90.0)  = aceptado bin.
#    - LWPOLYLINE #39 (483 x 254 mm @ center 241.6,-126.7)  = estacion control
#         (OUTSIDE mesa, south).
#    - Cluster around (876..952, 200..305) = "Zona de remachado y disco
#         giratorio" cabin and pneumatic supplies (separate from the
#         disco giratorio itself, which sits at the upper-left of the
#         mesa where the 500x500 polyline + r=200 circle live).
#
# V37 IMPORTANT CHANGES vs V36:
#   * Cobot NO LONGER hangs.  It is now floor-mounted with a pedestal
#     column (height 0.55 m, radius 0.060 m) on cell_floor (z=0).
#     Mount rotation switched from Rx(-pi/2) (hanging) to Rx(+pi/2)
#     (standing).  Cobot base anchor at world (0.950, 0.972, 0.0)
#     with pedestal_top at z=0.550 so the canonical L03S J1 axis at
#     base_z+0.145 = 0.695 m and tool0 at q=0 at z = 0.550 + 0.468 = 1.018
#     (well above mesa top 1.000).
#     The DXF circle r=660 at (819.7, 383.1) describes the reach
#     envelope, NOT the base point; the base was shifted west to give
#     comfortable reach to ALL stations after the layout reshuffle.
#   * Process platform REMOVED.  Cobot reaches mesa-top items directly
#     from the pedestal, so the V36 elevated steel plate is gone.
#   * Aluminum cabin SIMPLIFIED.  Cobot does not hang from the cabin so
#     the top-profile cobot mount is removed.  The cabin frame is kept
#     as a visual enclosure with no load-bearing role.
#   * Disco giratorio REBUILT with 15 STLs from disco giratorio.zip.
#     STL inspection shows Z is already the vertical axis in the
#     exported meshes (gearbase z=0..3 at the bottom, disco-1 z=78..81
#     at the top, stands rise z=3..72).  The user's "Y_CAD -> Z_ROS"
#     directive was honoured by SolidWorks during the STL export
#     itself; the URDF therefore applies IDENTITY rotation (rpy 0 0 0)
#     on every disc visual.  Validation: every fixed visual was bbox-
#     checked to confirm zmin < zmax_stands < zmax_disco.
#   * Gripper alignment preserved: tool0 -> gripper_mount transform
#     unchanged from V36 (mount_xyz "0 -0.014 0", mount_rpy
#     "-1.5707963267948966 0 0", mount_yaw=pi).  SolidWorks 99.5 mm Z
#     reference -> link -Y mapping intact.
#
# V37 final world XY (table-centre frame, all metres, derived from DXF):
#
#   plant_table                  (1.252, 1.049)  size 1.620 x 0.920
#   conveyor_1                   (1.370, 1.365)  size 0.375 x 0.150  long X
#   disco giratorio (centre)     (0.692, 1.259)  500x500 base, 400 dia disc
#   rotary load mount  (south)   (0.692, 1.109)  cobot side
#   rotary rivet mount (north)   (0.692, 1.409)  press side
#   fixture remache (decorativo) (0.692, 1.259)  collapses into the disc
#   fixture_camara               (0.824, 0.804)  size 0.150 x 0.151
#   cognex_camera (body)         (0.824, 0.804)  z = 1.32 (0.32 m above mesa)
#   aceptado bin                 (1.411, 0.679)  size 0.227 x 0.172
#   rechazado bin                (1.110, 0.684)  size 0.227 x 0.182
#   control_station              (0.684, 0.462)  size 0.483 x 0.254
#                                                (OUTSIDE the mesa, south)
#   cobot base                   (0.950, 0.972, 0.0)  floor-mounted
#       pedestal_height 0.550 m  pedestal_radius 0.060 m
#       mount rotation Rx(+pi/2) (standing, CAD +Y -> world +Z)
#
# Heights (z, metres, from cell floor):
#   floor                        0.000
#   mesa top                     1.000
#   conveyor belt top            1.070  (mesa top + 0.070 belt rise)
#   disco gearbase bottom        1.000  (rests on mesa)
#   disco gearbase top           1.003
#   disco stands top             1.072
#   disco-1 (disc face)          1.078 .. 1.081
#   disco fixture mount face     1.081
#   fixture_camara plate top     1.015
#   bin floor                    1.000  (bin bottom rests on mesa top)
#   bin top                      1.150
#   cognex camera body           1.320  (= mesa 1.000 + 0.320)
#   cobot pedestal top           0.550
#   cobot J1 axis                0.695  (pedestal_top + canonical 0.145)
#   cobot tool0 at q=0           1.018  (J1_z + canonical 0.468 - 0.145)
#                                       ; well above mesa top
#   ceiling cabin top            2.070  (kept from V36, decorative only)
#
# REACH from cobot base (0.950, 0.972) (XY plane):
#   conveyor PICK    (1.370, 1.365)  d = 0.575  (margin 0.051)
#   disc LOAD        (0.692, 1.109)  d = 0.292  (margin 0.334)
#   fixture_camara   (0.824, 0.804)  d = 0.210  (margin 0.416)
#   aceptado         (1.411, 0.679)  d = 0.546  (margin 0.080)
#   rechazado        (1.110, 0.684)  d = 0.329  (margin 0.297)
#
# All 5 cobot targets within reach radius 0.626 m.  RIVET pos (0.692,
# 1.409) at d = 0.520 m is also reachable but the cobot does not need
# it: index 180 brings the riveted CAFI back to LOAD where the cobot
# picks it.
# ----------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# Cell envelope
# ---------------------------------------------------------------------------
cell_envelope:
  source: real_dxf
  dxf_handle: 5D6
  ros_center_m: {x: 1.252205, y: 1.049061}
  ros_size_m:   {size_x: 2.504408, size_y: 2.098121}

floor:
  source: derived
  z_source: assumed_at_ground
  ros_center_m: {x: 1.252205, y: 1.049061}
  ros_size_m:   {size_x: 2.504408, size_y: 2.098121}
  thickness_m: 0.005
  top_z_m: 0.0

# ---------------------------------------------------------------------------
# Plant table  (V9: lengthened in Y from 1.500 to 1.600 m; centre shifted
# south 20 mm to 1.150 so the south margin for the bins is larger and the
# north edge stays clear of the riveting cabin)
# ---------------------------------------------------------------------------
plant_table:
  source: V8_component_v9_lengthened
  ros_center_m: {x: 1.265000, y: 1.150000}
  ros_size_m:   {size_x: 2.000, size_y: 1.600}
  v9_change_note: |
    V8 had size_y=1.500 centre y=1.130.  V9 keeps the same X but bumps
    size_y to 1.600 and shifts the centre south by 20 mm so the new
    bigger bins (0.150 m tall) have a comfortable margin from the south
    edge (bin south edge at world y=0.391 vs mesa south edge at 0.350,
    gap 41 mm; vs V8 the gap was only 11 mm).
  top_z_m: 1.200
  thickness_m: 0.040
  leg_section_m: 0.060
  leg_inset_m: 0.080
  stretcher_section_m: 0.040
  footprint_includes:
    - conveyor_1
    - suministro_cafi
    - aceptado
    - rechazado
    - riveting_zone (rotary index table + 2 fixtures + cabin)
    - vision_zone
    - cognex_camera (column footprint)
    - cobot (fixed, no rail)
  footprint_excludes:
    - control_station (SW of the table)
    - operator_chair (south of the control station)
  envelope_check:
    x_range: [0.265, 2.265]
    y_range: [0.350, 1.950]
    cell_envelope_x: [0.000, 2.504]
    cell_envelope_y: [0.000, 2.098]
    inside_cell_envelope: true
    control_station_n_edge_y: 0.330
    plant_table_s_edge_y: 0.350
    gap_to_control_station_m: 0.020

# ---------------------------------------------------------------------------
# Cobot Lexium LXMRL03S0000 (3 kg, reach 626 mm)
#   V9: cobot is FIXED on the plant table top.  No rail, no prismatic
#   joint.  In static pose, tool0 lands directly above the LOAD fixture
#   of the rotary index table at world (1.671, 1.475).
# ---------------------------------------------------------------------------
cobot:
  source: V15_articulated_dynamic_model
  dxf_handle: 2D6
  model: Schneider Lexium LXMRL03S0000
  controller: LXMRL03C1000
  parent_frame: world
  ros_base_m: {x: 1.670548, y: 0.920000}
  ros_base_m_note: |
    V10: cobot shifted 200 mm SOUTH so its static-pose tool0 reaches the
    rotary disc LOAD mount (world y=1.275).  V14/V15 keep this base pose
    byte-for-byte.
  base_z_m: 1.200
  base_z_source: directly_on_plant_table_top_no_rail
  yaw: 1.5707963267948966
  yaw_source: north_facing_unchanged
  reach_radius_m: 0.626
  reach_source: real_dxf_circle_r_matches_LXMRL03S0000_spec
  pedestal_height_m: 0.25
  pedestal_radius_m: 0.055
  pedestal_source: V5_kept_unchanged
  articulated: true
  articulated_source: |
    V15: the cobot is rebuilt as a proper ARTICULATED, DYNAMIC model.
    V14 had loaded the real Schneider STEP as ONE rigid fused mesh - it
    looked right but was a static statue.  V15 replaces that with a
    13-link / 6-revolute-joint chain in lexium_cobot_real.xacro.  The
    STEP is a single PRODUCT with no separated links, so per-link CAD is
    not available; V15 therefore RECONSTRUCTS each segment with faithful
    primitive geometry sized from the real LXMRL03S0000 and the V14 STEP
    envelope.  The STEP STL is kept in the package as a geometric
    reference asset (meshes/cobot_lexium_l03s/) but is no longer loaded
    by the URDF.
  v15_articulated_model:
    component_macro: lexium_cobot_real
    component_file: urdf/components/lexium_cobot_real.xacro
    links: [base, mount, pedestal, j1, shoulder, upper_arm, elbow,
            forearm, wrist1, wrist2, wrist3, flange, tool0]
    revolute_joints:
      J1: {parent: pedestal,  child: j1,        axis: [0,0,1], origin_xyz: [0,0,0.145],   limit_rad: [-3.1416, 3.1416]}
      J2: {parent: shoulder,  child: upper_arm, axis: [0,1,0], origin_rpy: [0,-0.9599310885968813,0], limit_rad: [-2.0944, 2.0944]}
      J3: {parent: elbow,     child: forearm,   axis: [0,1,0], origin_rpy: [0, 0.9599310885968813,0], limit_rad: [-2.6180, 2.6180]}
      J4: {parent: forearm,   child: wrist1,    axis: [1,0,0], origin_xyz: [0.215,0,0],   limit_rad: [-6.2832, 6.2832]}
      J5: {parent: wrist1,    child: wrist2,    axis: [0,1,0], origin_rpy: [0, 1.5707963267948966,0], limit_rad: [-2.0944, 2.0944]}
      J6: {parent: wrist2,    child: wrist3,    axis: [1,0,0], origin_xyz: [0.035,0,0],   limit_rad: [-6.2832, 6.2832]}
    joint_dynamics: {effort: 56.0, velocity: 3.1416, damping: 0.10, friction: 0.0}
    kinematics_note: |
      EVERY joint origin is byte-for-byte the transform the V5..V14
      proxy chain used (extracted by FK from the expanded V13 URDF).
      The 6 joints were simply promoted from `fixed` to `revolute`.  So
      with all joints at q=0 - the value joint_state_publisher publishes
      by default, since 0 is inside every limit - the kinematics are
      IDENTICAL to V13/V14:
        base->tool0 xyz = 0.355526227 0 0.468192251
        base->tool0 rpy = 3.141592654 0 3.141592654
        world tool0     = (1.670548, 1.275526, 1.668193) rpy (pi,0,-pi/2)
      verified by FK on the expanded V15 URDF (error 0.0008 mm).  The
      cobot is NOT moved, the reach is unchanged, new_gripper does not
      move.  Launch with gui:=true for the J1..J6 sliders.
    geometry: |
      white tubular links + dark cylindrical joint-module drums +
      Schneider-green accent rings, sized from the LXMRL03S0000 and the
      STEP envelope - reads as a Lexium, not as the old V5 stick proxy
      and not as a single rigid block.
  reference_asset:
    step: planta Schneider/03_modelo_step_cobot/Lexium_Cobot_L03S_3D-simpl.STEP
    mesh_kept: package://schneider_cell_description/meshes/cobot_lexium_l03s/lexium_l03s.STL
    role: geometric reference only - NOT loaded by the URDF since V15
  proxy_replaced:
    old_component: urdf/components/lexium_cobot.xacro  (V5 primitive proxy, DEPRECATED, kept on disk for history)
    history: |
      V5..V13 = primitive proxy (lexium_cobot.xacro).  V14 = real STEP
      loaded as one rigid static mesh (lexium_cobot_real.xacro).  V15 =
      articulated reconstruction (lexium_cobot_real.xacro rewritten).

