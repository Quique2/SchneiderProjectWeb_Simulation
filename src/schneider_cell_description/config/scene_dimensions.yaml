# ---------------------------------------------------------------------------
# Riveting zone  (V9: anchor frame on the mesa surface, same as V8.
#                 Press now hangs over the NORTH rivet mount of the rotary
#                 index table, not over the zone centre)
# ---------------------------------------------------------------------------
riveting_zone:
  source: V8_anchor_frame_v10_press_restored
  dxf_handle: 50F
  ros_center_m: {x: 1.670548, y: 1.475347}
  ros_size_m:   {size_x: 1.000, size_y: 0.700}
  anchor_z_m: 1.200
  v10_form: empty_anchor_link_no_visual
  riveting_cabin_module:
    cabin_size_m: {size_x: 0.700, size_y: 0.400}
    cabin_height_m: 0.500
    cabin_y_offset_in_zone_m: 0.150
    cabin_y_offset_note: pushed_NORTH_back_of_work_zone_v8_unchanged
    canopy:
      thickness_m: 0.040
      top_z_local_m: 0.500
      top_z_world_m: 1.700
    press_offset_in_zone_m: [0.0, 0.000]
    press_offset_note: |
      V10: press_offset_y RESTORED to V8 value 0.000.  Press hangs over
      zone CENTRE = world (1.671, 1.475) = V10 RIVET mount of the
      rotary disc.  Tip bottom at z_local=0.130 (world 1.330), ~80 mm
      above the CAFI top (world z=1.250) when a loaded CAFI is brought
      to the RIVET mount.

# ---------------------------------------------------------------------------
# Rotary index table  (V9 NEW)
# ---------------------------------------------------------------------------
rotary_index_table:
  source: V9_component_v10_repositioned_smaller
  parent_frame: riveting_zone
  disc_ros_center_local_m: {x: 0.000, y: -0.100}
  disc_ros_center_world_m: {x: 1.670548, y: 1.375347}
  disc_top_z_world_m: 1.220
  disc_thickness_m: 0.020
  disc_radius_m: 0.100
  mount_radius_m: 0.100
  load_mount_world_m: {x: 1.670548, y: 1.275347, z: 1.220}
  load_mount_position: OUTSIDE_cabin_south_of_cabin_south_face
  rivet_mount_world_m: {x: 1.670548, y: 1.475347, z: 1.220}
  rivet_mount_position: INSIDE_cabin_at_zone_centre_under_press
  cabin_south_face_world_y: 1.425
  load_clearance_to_cabin_s_m: 0.150
  rivet_clearance_to_cabin_s_m: 0.050
  v10_change_note: |
    V9 had disc centre at zone (0, +0.150) and radius 0.150, putting
    BOTH mounts INSIDE the cabin (V9 LOAD at y=1.475, RIVET at y=1.775,
    both north of the cabin south face).  V10 shifts the disc south
    by 0.250 m (centre to zone (0, -0.100)) and shrinks the radius to
    0.100 m so:
      - LOAD mount is now at world y=1.275, 150 mm SOUTH of the cabin
        south face (y=1.425) - fully OUTSIDE the cabin, accessible to
        the cobot.
      - RIVET mount is now at world y=1.475 (zone centre), under the
        V8 press (which is also at zone centre).
  flow:
    step_1: cobot picks/places a CAFI on the LOAD fixture (south of cabin, world y=1.275)
    step_2: disc rotates 180 deg around its centre at world (1.671, 1.375)
    step_3: the loaded CAFI lands on the RIVET fixture (inside cabin, world y=1.475) directly under the press head

fixture_load:
  source: assumed_rivet_fixture_on_load_mount_v11
  parent_frame: rotary_table_load_mount
  ros_center_world_m: {x: 1.670548, y: 1.275347}
  base_z_m: 0.000
  yaw: 3.141592653589793
  yaw_source_v11: |
    V11: pre-rotated by pi so that, after the disc indexes 180 deg to
    swap LOAD <-> RIVET, the fixture arrives at the press at world yaw
    = pi + pi = 2*pi = 0 (= fixture_rivet_pos's canonical orientation).
    Visual consequence: at the LOAD station the fixture appears INVERTED
    relative to fixture_rivet_pos.  This is correct - it is the price
    of the 180-deg index.  The cobot does not care about LOAD-side
    orientation; what matters is the CAFI lands correctly under the
    press, which V11 guarantees.
  visual_rpy: [1.5707963267948966, 0.0, 0.0]
  mesh: package://schneider_cell_description/meshes/fixtures/Fixture_para_remache_1.STL
  mesh_scale: [0.001, 0.001, 0.001]
  bottom_z_world_m: 1.220
  top_z_world_m: 1.250
  function: load_fixture_for_cobot_to_place_CAFI_outside_cabin
  world_yaw_at_load_position: 3.141592653589793
  world_yaw_after_180deg_disc_index: 0.0

cafi_load:
  source: real_stl_nested_in_fixture_load
  parent_frame: fixture_load
  z_offset_above_fixture_m: 0.005
  visual_rpy: [1.5707963267948966, 0.0, 0.0]
  mesh: package://schneider_cell_description/meshes/cafi/cafi.STL
  mesh_scale: [0.001, 0.001, 0.001]
  ros_center_world_m: {x: 1.670548, y: 1.275347}
  base_z_world_m: 1.225
  top_z_world_m: 1.250
  inherits_fixture_yaw: true
  world_yaw_at_load_position: 3.141592653589793
  world_yaw_after_180deg_disc_index: 0.0
  v11_note: |
    CAFI inherits fixture_load's yaw (joint to parent has rpy=0).  So
    when fixture_load is pre-rotated by pi, the CAFI is also at world
    yaw = pi at the LOAD station, and at world yaw = 0 (correct) after
    the 180-deg disc index brings it to the RIVET station.

fixture_rivet_pos:
  source: assumed_rivet_fixture_on_rivet_mount_v10
  parent_frame: rotary_table_rivet_mount
  ros_center_world_m: {x: 1.670548, y: 1.475347}
  base_z_m: 0.000
  yaw: 0.0
  yaw_source: canonical_correct_orientation_under_press_v10_v11
  visual_rpy: [1.5707963267948966, 0.0, 0.0]
  mesh: package://schneider_cell_description/meshes/fixtures/Fixture_para_remache_1.STL
  mesh_scale: [0.001, 0.001, 0.001]
  bottom_z_world_m: 1.220
  top_z_world_m: 1.250
  function: rivet_fixture_inside_cabin_under_press_head
  world_yaw_at_rivet_position: 0.0
  world_yaw_after_180deg_disc_index: 3.141592653589793

# ---------------------------------------------------------------------------
# Vision (camera inspection) workstation  -  V13 IN COBOT REACH
# ---------------------------------------------------------------------------
vision_zone:
  source: V13_moved_into_cobot_reach
  ros_center_m: {x: 2.050000, y: 1.200000}
  ros_center_source_v13: |
    V12 placed vision_zone at (2.150, 1.475) which was 0.733 m from
